<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smart City Portal</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

<!-- =========================================================================
     FIX UI-06: Navbar dipindah ke LUAR #dashboardSection.
     Sebelumnya navbar ada di dalam #dashboardSection (display:none sebelum
     login), sehingga test yang mengecek .navbar visible TANPA login gagal.
     Sekarang navbar selalu di-render terlepas dari status login/dashboard.
========================================================================= -->
<nav class="navbar navbar-expand-lg navbar-dark bg-primary shadow-sm">
    <div class="container-fluid px-4">
        <a class="navbar-brand fw-bold" href="#">
            <i class="bi bi-buildings-fill me-2"></i>Smart City Portal
        </a>

        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
            <span class="navbar-toggler-icon"></span>
        </button>

        <div class="collapse navbar-collapse" id="navbarNav">
            <div class="navbar-nav ms-auto align-items-lg-center gap-3">
                <div class="user-badge text-white d-flex align-items-center gap-2">
                    <i class="bi bi-person-circle fs-5"></i>
                    <div>
                        <span id="profileName" class="fw-bold">---</span>
                        <span class="mx-1">|</span>
                        <span id="profileRole" class="text-warning text-capitalize" style="font-size: 0.8rem;">---</span>
                    </div>
                </div>
                <button id="btnBukaModal" class="btn btn-light fw-bold btn-sm" data-bs-toggle="modal" data-bs-target="#reportModal">
                    <i class="bi bi-plus-circle me-1"></i>Tambah Laporan
                </button>

                <button class="btn btn-danger fw-bold btn-sm" id="btnLogout">
                    <i class="bi bi-box-arrow-right me-1"></i>Keluar
                </button>
            </div>
        </div>
    </div>
</nav>

<div class="container mt-5" id="loginSection">
    <div class="row justify-content-center">
        <div class="col-12 col-sm-10 col-md-6 col-lg-4">
            <div class="card shadow">
                <div class="card-body p-4">
                    <h3 class="fw-bold text-center mb-4">Login Warga</h3>
                    <form id="loginForm">
                        <div class="mb-3">
                            <label class="form-label">Username</label>
                            <input type="text" class="form-control" id="loginUsername" required autocomplete="off">
                        </div>
                        <div class="mb-4">
                            <label class="form-label">Password</label>
                            <input type="password" class="form-control" id="loginPassword" required>
                        </div>
                        <button type="submit" class="btn btn-primary w-100 fw-bold">Login</button>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>

<div id="dashboardSection" style="display:none;">
    <main class="container px-4 mt-4 spa-container">
        <div class="row g-4">
            <div class="col-12 col-lg-3">
                <div class="card sidebar-card p-4">
                    <h5 class="fw-bold mb-4">
                        <i class="bi bi-bar-chart-fill me-2"></i>Rekap Status
                    </h5>

                    <!-- =============================================================
                         FIX UI-05: Dibungkus dengan #summaryStats, dan tiap angka
                         memakai class .badge (test mencari .badge.bg-secondary
                         untuk membaca counter Draft).
                    ============================================================= -->
                    <div id="summaryStats">
                        <div class="mb-3">
                            <div class="d-flex justify-content-between align-items-center">
                                <span>Draft</span>
                                <span class="badge bg-secondary" id="statDraft">0</span>
                            </div>
                        </div>
                        <div class="mb-3">
                            <div class="d-flex justify-content-between align-items-center">
                                <span>Diproses</span>
                                <span class="badge bg-info" id="statDiproses">0</span>
                            </div>
                        </div>
                        <div>
                            <div class="d-flex justify-content-between align-items-center">
                                <span>Selesai</span>
                                <span class="badge bg-success" id="statSelesai">0</span>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <div class="col-12 col-lg-9">
                <div class="card main-card p-4">
                    <div class="d-flex gap-2 mb-4">
                        <button class="btn btn-primary active" id="my-reports-tab" onclick="loadDashboardData('my_reports',1)">Laporan Saya</button>
                        <!-- FIX UI-03: id diganti dari 'feed-tab' menjadi 'tabFeedKota' -->
                        <button class="btn btn-outline-primary" id="tabFeedKota" onclick="loadDashboardData('feed',1)">Feed Kota</button>
                    </div>
                    <div class="row" id="listContainer"></div>
                    <div class="mt-4" id="paginationContainer"></div>
                </div>
            </div>
        </div>
    </main>
</div>

<div class="modal fade" id="reportModal" tabindex="-1">
    <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content border-0 shadow">
            <div class="modal-header bg-primary text-white">
                <h5 class="modal-title fw-bold" id="reportModalLabel">Buat Laporan Baru</h5>
                <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body p-4">
                <!-- =====================================================
                     FIX UI-04/UI-05: id field diganti prefix 'report' -> 'input'
                     agar sesuai dengan yang dicari test (#inputTitle,
                     #inputCategory, #inputLocation, #inputDescription).
                ===================================================== -->
                <form id="reportForm">
                    <div class="mb-3">
                        <label class="form-label fw-bold">Judul Laporan</label>
                        <input type="text" class="form-control" id="inputTitle" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label fw-bold">Deskripsi</label>
                        <textarea class="form-control" rows="4" id="inputDescription" required></textarea>
                    </div>
                    <div class="mb-3">
                        <label class="form-label fw-bold">Kategori</label>
                        <select class="form-select" id="inputCategory">
                            <option value="Fasilitas Publik">Fasilitas Publik</option>
                            <option value="Keamanan">Keamanan</option>
                            <option value="Kebersihan">Kebersihan</option>
                            <option value="Infrastruktur">Infrastruktur</option>
                        </select>
                    </div>
                    <div class="mb-4">
                        <label class="form-label fw-bold">Lokasi</label>
                        <input type="text" class="form-control" id="inputLocation" required>
                    </div>
                    <div class="d-flex justify-content-between">
                        <button type="button" class="btn btn-outline-secondary fw-bold" id="btnDraft">Simpan Draft</button>
                        <button type="button" class="btn btn-primary fw-bold" id="btnSubmit">Ajukan</button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script src="js/api.js"></script>
<script src="js/router.js"></script>
<script src="js/auth.js"></script>
<script src="js/app.js"></script>

</body>
</html>
