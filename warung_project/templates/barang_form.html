{% extends 'base.html' %}
{% block content %}

<style>
    input, select {
        display: block;
        width: 100%;
        padding: 0.5rem 0.75rem;
        font-size: 1rem;
        font-weight: 400;
        line-height: 1.5;
        color: #212529;
        background-color: #fff;
        border: 1px solid #dee2e6;
        border-radius: 8px;
        transition: border-color .15s ease-in-out;
    }
    input:focus, select:focus {
        border-color: #0d6efd;
        outline: 0;
        box-shadow: 0 0 0 0.25rem rgba(13, 110, 253, .15);
    }
    .input-group > input {
        flex: 1 1 auto;
        width: 1%;
        border-top-left-radius: 0;
        border-bottom-left-radius: 0;
    }
</style>

<div class="row justify-content-center">
    <div class="col-lg-9">
        
        <!-- HEADER -->
        <div class="d-flex align-items-end justify-content-between mb-3">
            <div>
                <h3 class="fw-bold mb-0">
                    {% if object %}Edit Barang{% else %}Tambah Barang{% endif %}
                </h3>
                <p class="text-muted mb-0 small">Pastikan informasi stok sudah sesuai</p>
            </div>
            <a href="/barang/" class="btn btn-outline-secondary btn-sm">Batal</a>
        </div>

        <!-- FORM CARD -->
        <div class="card shadow-sm border-0">
            <div class="card-body p-4">
                <form method="post">
                    {% csrf_token %}

                    <div class="row g-3">
                        <div class="col-md-6">
                            <label class="form-label small fw-bold">Nama Barang</label>
                            {{ form.nama }}
                        </div>

                        <div class="col-md-6">
                            <label class="form-label small fw-bold">Kategori</label>
                            {{ form.kategori }}
                        </div>

                        <div class="col-md-6">
                            <label class="form-label small fw-bold">Harga Beli</label>
                            <div class="input-group">
                                <span class="input-group-text bg-light text-muted">Rp</span>
                                {{ form.harga_beli }}
                            </div>
                        </div>

                        <div class="col-md-6">
                            <label class="form-label small fw-bold">Jumlah Stok</label>
                            {{ form.stok }}
                        </div>
                    </div>

                    <hr class="my-4 opacity-25">

                    <div class="text-end">
                        <button type="submit" class="btn btn-primary px-5 shadow-sm">
                            <i class="bi bi-check2-circle me-1"></i> Simpan Data
                        </button>
                    </div>
                </form>
            </div>
        </div>

    </div>
</div>

{% endblock %}
